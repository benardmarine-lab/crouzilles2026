  var h='<p class="hint">&#9999;&#65039; Appuie sur le nom pour modifier &nbsp;|&nbsp; &#8597; = ordonner &nbsp;|&nbsp; &#8644; = changer de jour</p>';

    var day=plan[di];var op=openD.has(day.id);
    h+='<div class="card">';
    h+=`<button class="chdr" onclick="togD('${day.id}')">`;
    h+=`<div><span class="dtitle">${day.day}</span>`;
    if(day.note) h+=`<span class="dnote">${day.note}</span>`;
    h+='</div>';
    h+=`<span class="arrow${op?' open':''}">&#9660;</span></button>`;
    if(op){
      for(var mi=0;mi<day.meals.length;mi++){
        var m=day.meals[mi];var isM=movingMeal&&movingMeal.mId===m.id;
        if(eM[m.id]){
          h+=`<div class="mhdr"><input class="etitle" id="et_${m.id}" value="${q(m.name)}" onkeydown="if(event.key==='Enter')saveM('${day.id}','${m.id}')">`;
          h+=`<button class="svbtn" onclick="saveM('${day.id}','${m.id}')">&#10003;</button>`;
          h+=`<button class="cbtn" onclick="cancelM('${m.id}')">&#10005;</button></div>`;
        } else {
          h+='<div class="mhdr">';
          h+=`<span class="mtxt">${m.name}</span>`;
          h+='<div class="mbtngrp">';
          h+=`<button class="mbtn" ${mi>0?'':'disabled'} onclick="moveMUD('${day.id}','${m.id}',-1)">&#8593;</button>`;
          h+=`<button class="mbtn" ${mi<day.meals.length-1?'':'disabled'} onclick="moveMUD('${day.id}','${m.id}',1)">&#8595;</button>`;
          h+=`<button class="mbtn${isM?' move':''}" onclick="togMP('${day.id}','${m.id}')">&#8644;</button>`;
          h+=`<button class="ebtn" onclick="startM('${m.id}')">&#9999;&#65039;</button>`;
          h+='</div></div>';
        }
        if(isM){
          h+='<div class="movepanel"><div class="movepanel-title">Déplacer vers :</div><div class="daylist">';
          for(var ti=0;ti<plan.length;ti++){
            var td=plan[ti];
            h+=`<button class="daybtn" onclick="moveMD('${m.id}','${td.id}')">${td.day}${td.id===day.id?' (ici)':''}</button>`;
          }
          h+='</div>';
          h+=`<button class="cbtn" style="margin-top:6px" onclick="togMP('${day.id}','${m.id}')">&#10005; Annuler</button></div>`;
        }
        if(!m.ings.length) h+='<div class="noings">Pas d\'ingrédients à préparer</div>';
        for(var ii=0;ii<m.ings.length;ii++){
          var ing=m.ings[ii];
          if(eI[ing.id]){
            h+='<div class="irow"><span></span>';
            h+=`<input class="iname" id="in_${ing.id}" value="${q(ing.name)}" onkeydown="if(event.key==='Enter')saveI('${day.id}','${m.id}','${ing.id}')">`;
            h+=`<input class="qty" type="text" value="${ing.qty}" onchange="setQ('${day.id}','${m.id}','${ing.id}',this.value)">`;
            h+=`<span class="utxt">${ing.unit}</span>`;
            h+=`<button class="okbtn" style="padding:4px 6px;font-size:12px" onclick="saveI('${day.id}','${m.id}','${ing.id}')">&#10003;</button></div>`;
          } else {
            h+='<div class="irow"><div class="imove">';
            h+=`<button class="imvbtn" ${ii>0?'':'disabled'} onclick="moveI('${day.id}','${m.id}','${ing.id}',-1)">&#9650;</button>`;
            h+=`<button class="imvbtn" ${ii<m.ings.length-1?'':'disabled'} onclick="moveI('${day.id}','${m.id}','${ing.id}',1)">&#9660;</button>`;
            h+='</div>';
            h+=`<span class="inm" onclick="startI('${ing.id}')">${ing.name}</span>`;
            h+=`<input class="qty" type="text" value="${ing.qty}" onchange="setQ('${day.id}','${m.id}','${ing.id}',this.value)">`;
            h+=`<span class="utxt">${ing.unit}</span>`;
            h+=`<button class="delbtn" onclick="delI('${day.id}','${m.id}','${ing.id}')">&#10005;</button></div>`;
          }
        }
        if(aP[m.id]){
          h+='<div class="azone"><div class="arow">';
          h+=`<input class="anm" id="anm_${m.id}" type="text" placeholder="Ingrédient" onkeydown="if(event.key==='Enter')addI('${day.id}','${m.id}')">`;
          h+=`<input class="aqt" id="aqt_${m.id}" type="text" placeholder="Qté">`;
          h+=`<input class="aun" id="aun_${m.id}" type="text" placeholder="unité">`;
          h+=`<button class="okbtn" onclick="addI('${day.id}','${m.id}')">&#10003;</button>`;
          h+='</div>';
          h+=`<button class="cbtn" onclick="cancelP('${m.id}')">&#10005; Annuler</button></div>`;
        } else {
          h+=`<div class="azone"><button class="addbtn" onclick="showP('${m.id}')">＋ Ajouter un ingrédient</button></div>`;
        }
      }
    }
    h+='</div>';
  }
  document.getElementById('tab-planning').innerHTML=h;
  Object.keys(eM).forEach(function(id){var e=document.getElementById('et_'+id);if(e){e.focus();e.select();}});
  Object.keys(eI).forEach(function(id){var e=document.getElementById('in_'+id);if(e){e.focus();e.select();}});
  Object.keys(aP).forEach(function(id){var e=document.getElementById('anm_'+id);if(e)e.focus();});
}
function togD(id){if(openD.has(id))openD.delete(id);else openD.add(id);renderP();}
function startM(id){eM={};eM[id]=true;renderP();}
function cancelM(id){delete eM[id];renderP();}
function saveM(dId,mId){var v=document.getElementById('et_'+mId).value.trim();if(v){var d=fDay(dId);if(d){var m=fMeal(d,mId);if(m)m.name=v;}}delete eM[mId];sv();renderP();}
function startI(id){eI={};eI[id]=true;renderP();}
function saveI(dId,mId,iId){var v=document.getElementById('in_'+iId).value.trim();if(v){var d=fDay(dId);if(d){var m=fMeal(d,mId);if(m){var i=m.ings.find(function(x){return x.id===iId;});if(i)i.name=v;}}}delete eI[iId];sv();renderP();}
function setQ(dId,mId,iId,v){var d=fDay(dId);if(!d)return;var m=fMeal(d,mId);if(!m)return;var i=m.ings.find(function(x){return x.id===iId;});if(i){i.qty=v;sv();}}
function delI(dId,mId,iId){if(!confirm('Supprimer ?'))return;var d=fDay(dId);if(!d)return;var m=fMeal(d,mId);if(!m)return;m.ings=m.ings.filter(function(x){return x.id!==iId;});sv();renderP();}
function showP(id){aP[id]=true;renderP();}
function cancelP(id){delete aP[id];renderP();}
function addI(dId,mId){var nm=document.getElementById('anm_'+mId).value.trim();if(!nm)return;var qt=document.getElementById('aqt_'+mId).value.trim()||'1';var un=document.getElementById('aun_'+mId).value.trim();var d=fDay(dId);if(!d)return;var m=fMeal(d,mId);if(!m)return;m.ings.push({id:uid(),name:nm,qty:qt,unit:un});delete aP[mId];sv();renderP();}
function moveMUD(dId,mId,dir){var d=fDay(dId);if(!d)return;var i=d.meals.findIndex(function(m){return m.id===mId;});var j=i+dir;if(j<0||j>=d.meals.length)return;var tmp=d.meals[i];d.meals[i]=d.meals[j];d.meals[j]=tmp;sv();renderP();}
function togMP(dId,mId){if(movingMeal&&movingMeal.mId===mId){movingMeal=null;}else{movingMeal={dId:dId,mId:mId};}renderP();}
function moveMD(mId,toDayId){var srcDay=null,srcMeal=null;for(var i=0;i<plan.length;i++){var m=plan[i].meals.find(function(m){return m.id===mId;});if(m){srcDay=plan[i];srcMeal=m;break;}}if(!srcDay||!srcMeal)return;if(srcDay.id===toDayId){movingMeal=null;renderP();return;}srcDay.meals=srcDay.meals.filter(function(m){return m.id!==mId;});var toDay=fDay(toDayId);if(toDay)toDay.meals.push(srcMeal);movingMeal=null;openD.add(toDayId);sv();renderP();}
function moveI(dId,mId,iId,dir){var d=fDay(dId);if(!d)return;var m=fMeal(d,mId);if(!m)return;var i=m.ings.findIndex(function(x){return x.id===iId;});var j=i+dir;if(j<0||j>=m.ings.length)return;var tmp=m.ings[i];m.ings[i]=m.ings[j];m.ings[j]=tmp;sv();renderP();}
function renderC(){
  var h='<div class="legend"><span>Statut :</span><span class="badge ok">&#10003; Acheté</span><span class="badge ss">&#9733; En stock (SS)</span></div>';
  var cats=Object.keys(crs);
  for(var ci=0;ci<cats.length;ci++){
    var cat=cats[ci];var cfg=crs[cat];var op=openC.has(cat);
    var dn=cfg.items.filter(function(i){return i.st>0;}).length;
    var full=dn===cfg.items.length&&cfg.items.length>0;
    h+='<div class="card">';
    h+=`<button class="cathdr" onclick="togC('${cat}')">`;
    h+=`<span class="catlbl">${cfg.e} ${cfg.l}</span>`;
    h+='<div style="display:flex;align-items:center;gap:8px">';
    h+=`<span class="catct${full?' full':''}">${dn}/${cfg.items.length}</span>`;
    h+=`<span class="arrow${op?' open':''}">&#9660;</span></div></button>`;
    if(op){
      for(var ii=0;ii<cfg.items.length;ii++){
        var item=cfg.items[ii];
        var sc=item.st===1?'ok':item.st===2?'ss':'';
        var sy=item.st===1?'&#10003;':item.st===2?'&#9733;':'&#9675;';
        var ck='c_'+item.id;
        if(eI[ck]){
          h+=`<div class="crow"><button class="stbtn${sc?' '+sc:''}" onclick="cyc('${cat}','${item.id}')">${sy}</button>`;
          h+='<div class="cnm-col">';
          h+=`<input class="cname" id="cn_${item.id}" value="${q(item.name)}" onkeydown="if(event.key==='Enter')saveCN('${cat}','${item.id}')">`;
          h+=`<input class="ctag-input" id="ct_${item.id}" value="${item.tag||''}" placeholder="repas / jour">`;
          h+='</div>';
          h+=`<input class="cqty" type="text" value="${item.qty}" onchange="setCQ('${cat}','${item.id}',this.value)">`;
          h+=`<span class="cunit">${item.unit}</span>`;
          h+=`<button class="okbtn" style="padding:4px 6px;font-size:12px;flex-shrink:0;width:auto" onclick="saveCN('${cat}','${item.id}')">&#10003;</button></div>`;
        } else {
          h+=`<div class="crow${sc?' '+sc:''}">`;
          h+=`<button class="stbtn${sc?' '+sc:''}" onclick="cyc('${cat}','${item.id}')">${sy}</button>`;
          h+='<div class="cnm-col">';
          h+=`<span class="cnm" onclick="startCN('${item.id}')">${item.name}</span>`;
          if(item.tag) h+=`<span class="ctag" onclick="startCN('${item.id}')">${item.tag}</span>`;
          else h+=`<span class="ctag-ph" onclick="startCN('${item.id}')">+ repas/jour</span>`;
          h+='</div>';
          h+=`<input class="cqty" type="text" value="${item.qty}" onchange="setCQ('${cat}','${item.id}',this.value)">`;
          h+=`<span class="cunit">${item.unit}</span>`;
          h+=`<button class="delbtn" onclick="delC('${cat}','${item.id}')">&#10005;</button></div>`;
        }
      }
      if(aC[cat]){
        h+='<div class="cazone"><div class="carow">';
        h+=`<input class="anm" id="cnm_${cat}" type="text" placeholder="Article" onkeydown="if(event.key==='Enter')addC('${cat}')">`;
        h+=`<input class="aqt" id="cqt_${cat}" type="text" placeholder="Qté">`;
        h+=`<input class="aun" id="cun_${cat}" type="text" placeholder="unité">`;
        h+=`<button class="okbtn" onclick="addC('${cat}')">&#10003;</button>`;
        h+='</div>';
        h+=`<button class="cbtn" onclick="cancelC('${cat}')">&#10005; Annuler</button></div>`;
      } else {
        h+=`<div class="cazone"><button class="addbtn" onclick="showC('${cat}')">＋ Ajouter un article</button></div>`;
      }
    }
    h+='</div>';
  }
  h+='<p class="footer">Sauvegarde automatique 💾</p>';
  document.getElementById('tab-courses').innerHTML=h;
  updateCounter();
  Object.keys(eI).forEach(function(k){if(k.indexOf('c_')===0){var e=document.getElementById('cn_'+k.slice(2));if(e){e.focus();e.select();}}});
  Object.keys(aC).forEach(function(cat){var e=document.getElementById('cnm_'+cat);if(e)e.focus();});
}
function togC(cat){if(openC.has(cat))openC.delete(cat);else openC.add(cat);renderC();}
function startCN(id){eI={};eI['c_'+id]=true;renderC();}
function saveCN(cat,id){var v=document.getElementById('cn_'+id).value.trim();var te=document.getElementById('ct_'+id);if(v){var item=crs[cat].items.find(function(i){return i.id===id;});if(item){item.name=v;if(te)item.tag=te.value.trim();}}delete eI['c_'+id];sv();renderC();}
function cyc(cat,id){var i=crs[cat].items.find(function(x){return x.id===id;});i.st=(i.st+1)%3;sv();renderC();}
function setCQ(cat,id,v){var i=crs[cat].items.find(function(x){return x.id===id;});i.qty=v;sv();}
function delC(cat,id){if(!confirm('Supprimer ?'))return;crs[cat].items=crs[cat].items.filter(function(i){return i.id!==id;});sv();renderC();}
function showC(cat){aC[cat]=true;renderC();}
function cancelC(cat){delete aC[cat];renderC();}
function addC(cat){var nm=document.getElementById('cnm_'+cat).value.trim();if(!nm)return;var qt=document.getElementById('cqt_'+cat).value.trim()||'1';var un=document.getElementById('cun_'+cat).value.trim();crs[cat].items.push({id:uid(),name:nm,qty:qt,unit:un,st:0,tag:''});delete aC[cat];sv();renderC();}
migrate();
renderP();
renderC();
// Initial load from Firebase
fetch(FBURL)
  .then(function(r){return r.json();})
  .then(function(data){
    if(data&&Array.isArray(data.plan)&&data.plan.length>0){
      plan=data.plan;crs=data.crs;migrate();renderP();renderC();
    } else { sv(); }
  }).catch(function(){ sv(); });
// Poll every 5s
pollTimer=setInterval(fetchRemote,5000);
</script></body></html>
